quarkus.datasource.db-kind=postgresql
quarkus.datasource.db-name=bookbuddy
# Zugangsdaten nur für den Betrieb ohne Dev Services (prod), im Entwicklungsmodus setzt Quarkus sie selbst
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.transactions=ENABLED
quarkus.datasource.jdbc.transaction-isolation-level=READ_UNCOMMITTED
%dev.quarkus.datasource.devservices=true
quarkus.datasource.devservices.port=5435
%test.quarkus.datasource.devservices=true
%prod.quarkus.datasource.devservices=false
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script = import.sql
quarkus.datasource.jdbc.initial-size=5
quarkus.hibernate-orm.log.jdbc-warnings=true
quarkus.log.min-level=DEBUG
%dev.quarkus.hibernate-orm.log.sql = true
quarkus.hibernate-orm.metrics.enabled=true
quarkus.hibernate-orm.second-level-caching-enabled=true
quarkus.openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
testcontainers.reuse.enable=true
# quarkus.log.level=DEBUG
quarkus.rest-client.BookAPI.url=https://www.googleapis.com/books/v1
# Google-Books-API-Schlüssel (optional) wird über die Umgebungsvariable BOOK_API_KEY gesetzt, nicht hier.
# JWT-Schlüsselpaar: wird lokal erzeugt und nicht eingecheckt (siehe README)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=bookbuddy
smallrye.jwt.sign.key.location=privateKey.pem
quarkus.security.enabled=true
quarkus.security.authentication.enabled=true
smallrye.jwt.verify.algorithm=RS256
quarkus.security.auth.producers.enabled=true
quarkus.security.jwt.role-claim-key=groups
quarkus.jwt.auth.enabled=true


quarkus.smallrye-openapi.info-title=BookBuddy API
